<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown Timer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⏳ Countdown Timer</h1>

        <p class="subtitle">
            Create a countdown for your special event
        </p>

        <div class="form">

            <input
                type="text"
                id="eventName"
                placeholder="Enter event name"
            >

            <input
                type="datetime-local"
                id="eventDate"
            >

            <button onclick="startCountdown()">
                Start Countdown
            </button>

        </div>

        <h2 id="displayEvent">
            Your Event
        </h2>

        <div class="countdown">

            <div class="box">
                <span id="days">00</span>
                <p>Days</p>
            </div>

            <div class="box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>

            <div class="box">
                <span id="minutes">00</span>
                <p>Minutes</p>
            </div>

            <div class="box">
                <span id="seconds">00</span>
                <p>Seconds</p>
            </div>

        </div>

        <div id="message"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
